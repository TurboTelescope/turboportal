services:
  web:
    build: .
    restart: unless-stopped 
    ports:
      - "127.0.0.1:8000:5000"
      - "127.0.0.1:8001:5001"
    volumes:
      - /mnt/rds/turboportal/thumbnails:/skyportal/static/thumbnails
      - /mnt/rds/turboportal/persistentdata:/skyportal/persistentdata
      - cache:/skyportal/cache:z
      - ./config/docker.yaml:/etc/skyportal/docker.yaml
      - ./data:/skyportal/data
    environment:
      - FLAGS=--config=/etc/skyportal/docker.yaml
    security_opt:
      - label:disable
    depends_on:
      db-init:
        condition: service_completed_successfully
    sysctls: ["net.ipv4.ip_unprivileged_port_start=443"]

  # run_production does not create tables, so initialize the schema before the
  # app starts. create_all() is checkfirst=True, so this is a safe no-op against
  # an already-populated database.
  db-init:
    build: .
    command:
      [
        "bash",
        "-c",
        "source .venv/bin/activate && PYTHONPATH=. python skyportal/initial_setup.py --config=config.yaml",
      ]
    depends_on:
      db:
        condition: service_healthy

  db:
    # trixie, not bookworm: it carries the same glibc the database's
    # collations were built with, so text indexes stay valid.
    image: pgvector/pgvector:pg17-trixie
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - idle_in_transaction_session_timeout=10min
    environment:
      POSTGRES_USER: skyportal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skyportal
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/rds/turboportal/db:/var/lib/postgresql/data
    security_opt:
      - label:disable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyportal -d skyportal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cache:
