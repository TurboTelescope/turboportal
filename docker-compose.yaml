services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:5000"
      - "127.0.0.1:8001:5001"
    volumes:
      - /mnt/rds/turboportal/thumbnails:/skyportal/static/thumbnails
      - /mnt/rds/turboportal/persistentdata:/skyportal/persistentdata
      - ./config/docker.yaml:/etc/skyportal/docker.yaml
    environment:
      - FLAGS=--config=/etc/skyportal/docker.yaml
    security_opt:
      - label:disable
    depends_on:
      db-init:
        condition: service_completed_successfully

  # run_production does not create tables, so initialize the schema before the
  # app starts. create_all() is checkfirst=True, so this is a safe no-op against
  # an already-populated database.
  db-init:
    build: .
    command:
      ["bash", "-c", "source .venv/bin/activate && PYTHONPATH=. python skyportal/initial_setup.py --config=config.yaml"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: skyportal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skyportal
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/rds/turboportal/db:/var/lib/postgresql/data
    security_opt:
      - label:disable
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyportal -d skyportal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (redis-protocol) server backing skyportal.utils.valkey_cache.
  valkey:
    image: valkey/valkey:9.1.0
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    volumes:
      - valkeydata:/data
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  valkeydata:
