# Git-tracked groups/users/stream for the TurboPortal instance, loaded with
#   tools/data_loader.py data/turbo_seed.yaml --config=...
# Usernames mirror the values SkyPortal derives from Google OAuth (same client +
# normalization as before), so they match on first login. Telescopes/instruments/
# taxonomy come from data/db_seed.yaml via `make load_seed_data`. The Sitewide
# Group is auto-created by SkyPortal and is intentionally not seeded here.

groups:
  - name: TURBO New Mexico
    =id: turbo_nm
  - name: TURBO Crete
    =id: turbo_crete
  - name: TURBO Prototype
    =id: turbo_proto
  - name: Transient Candidates
    =id: g_tc
  - name: False Positives
    =id: g_fp
  - name: Asteroids
    =id: g_ast
  - name: Variable Stars
    =id: g_vs
  - name: Possible AGN
    =id: g_agn

streams:
  - name: TURBO
    =id: turbo_stream

