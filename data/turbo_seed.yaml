# Git-tracked groups + stream for the TurboPortal instance, loaded with
#   tools/data_loader.py data/turbo_seed.yaml --config=...
# Users are NOT seeded: SkyPortal binds a Google login to a user by oauth_uid
# (set on first login via the invite flow), so a seeded user row can't log in
# under invite-only and collides with a later invitation. Onboard everyone via
# Invitations instead. Telescopes/instruments/taxonomy come from data/db_seed.yaml
# via `make load_seed_data`. The Sitewide Group is auto-created by SkyPortal.

groups:
  - name: TURBO New Mexico
    =id: turbo_nm
  - name: TURBO Crete
    =id: turbo_crete
  - name: TURBO Prototype
    =id: turbo_proto
  - name: Transient Candidates
    =id: g_tc
  - name: False Positives
    =id: g_fp
  - name: Asteroids
    =id: g_ast
  - name: Variable Stars
    =id: g_vs
  - name: Possible AGN
    =id: g_agn

streams:
  - name: TURBO
    =id: turbo_stream
